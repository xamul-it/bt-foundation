# btmain run config - OvernightAH AUC dynamic paper reference.
# Uso:
#   cd /home/htpc/backtrader/bt-core
#   python btmain.py --run-config /home/htpc/backtrader/bt-strategy-test/overnight-ah/run-configs/overnight_ah_auc_dynamic_paper.toml
#
# Nota: per un vero run paper servono le env vars Alpaca caricate fuori da
# questo file. Non salvare chiavi in questa directory.

mode = "paper"
id = "overnight_ah_auc_dynamic_paper"
live = false
plot = false
debug = false
log_trades = false
opt = false

[data]
provider = "yahoo"
alpaca_mode = "direct"
alpaca_feed = "sip"
fromdate = "2025-05-01"
todate = ""
data = "data"
benchmark = ""
bench_feed = false
timeframe = "daily"

[broker]
commission = "none"
cash = "200000"
amount = "10000"
margin_rate = ""
margin_leverage = 2.0
slippage = ""

[universe]
overlap_policy = "allow"

[[strategies]]
id = "overnight_ah_auc_dynamic_paper"
class = "overnight_ah.OvernightAH"
ticker = "yahoo_adj_research_universe.json"
timeframe = "daily"

[strategies.params]
max_concurrent = 5
size_by_max_concurrent = true
max_exposure = 2
min_intraday_vol = 0.025
max_intraday_vol = 0.045
intraday_vol_filter_side = "any"
ah_lag1_threshold = -0.1
min_adv = 100000000
auction = false
earnings_skip = false
monthly_universe_mode = "weak_theme_switch"
monthly_universe_top_n = 50
monthly_universe_base_weight = 0.85
monthly_universe_theme_weight = 0.15
monthly_universe_theme_score = "corr12"
monthly_universe_switch_feature = "semis_total_3m"
monthly_universe_switch_threshold = 0.0
monthly_universe_spy_dd3m_threshold = -0.10
